name = "ricette-ai"
main = "worker.js"
compatibility_date = "2026-09-01"

# Limite per dispositivo/IP: protegge la chiave da abusi
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 15, period = 60 }

[ai]
binding = "AI"

# Prezzi ufficiali MIMIT salvati qui
[[kv_namespaces]]
binding = "PRICES_KV"
id = "1f8f442ded57461287f282549cd2fab2"

# Aggiornamento prezzi mensile: ogni giorno alle 4:00 UTC controlla se il MIMIT ha pubblicato un mese nuovo e aggiorna un lotto di province
[triggers]
crons = ["0 4 * * *"]

# Ricette personali sincronizzate tra dispositivi (cifrate sul telefono: qui arrivano solo dati illeggibili)
[[d1_databases]]
binding = "SYNC"
database_name = "gnamina-sync"
database_id = "379736d5-8d05-4c1e-b18c-fb3aed808a59"

# Account: ID del progetto Firebase (Authentication). Vuoto finché il progetto non è configurato: gli account restano disattivati.
[vars]
FIREBASE_PROJECT = ""
