<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aggregatore Ricette</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="theme-color" content="#c8553d">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#faf7f2;--card:#fff;--fg:#2b2620;--mut:#7a7066;--acc:#c8553d;--bd:#e8e1d6;--ok:#4a7c59;--star:#e0a526}
@media (prefers-color-scheme:dark){:root{--bg:#1c1a17;--card:#26231f;--fg:#eee6db;--mut:#a39888;--acc:#e07a5f;--bd:#3a352e;--ok:#7fb28d}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--fg);padding-bottom:90px}
header{position:sticky;top:0;z-index:2;background:var(--bg);padding:calc(12px + env(safe-area-inset-top)) 16px 8px;border-bottom:1px solid var(--bd)}
.top{display:flex;align-items:center;gap:8px}
h1{margin:0;font-size:1.25rem;flex:1}
input,select,textarea{font:inherit;width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--fg)}
#q{margin:10px 0 8px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--bd);background:var(--card);color:var(--fg);padding:6px 12px;border-radius:999px;font:inherit;font-size:.9rem;cursor:pointer}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.filters{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px}
.filters select{padding:7px 8px;font-size:.82rem}
@media (max-width:520px){.filters{grid-template-columns:1fr 1fr}}
main{max-width:900px;margin:0 auto;padding:12px 16px}
.list{display:grid;gap:10px}
.item{display:flex;gap:12px;background:var(--card);border:1px solid var(--bd);border-radius:14px;overflow:hidden;cursor:pointer}
.thumb{width:96px;min-height:96px;flex:none;background:var(--bd);position:relative;display:flex;align-items:center;justify-content:center;font-size:2rem}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.thumb .play{position:absolute;right:4px;bottom:4px;font-size:.7rem;background:#000a;color:#fff;border-radius:999px;padding:2px 6px}
.item .b{padding:10px 12px 10px 0;flex:1;min-width:0}
.item h3{margin:0 0 4px;font-size:.98rem;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.meta{font-size:.78rem;color:var(--mut)}
.badges{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.bdg{font-size:.7rem;padding:2px 7px;border-radius:999px;border:1px solid var(--ok);color:var(--ok)}
.bdg.z{border-color:var(--bd);color:var(--mut)}
.stars{color:var(--star);letter-spacing:1px}
.empty{color:var(--mut);text-align:center;padding:40px 10px;line-height:1.5}
.btn{border:1px solid var(--bd);background:var(--card);color:var(--fg);padding:10px 16px;border-radius:999px;font:inherit;cursor:pointer;text-decoration:none;display:inline-block}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.icon{background:none;border:none;font-size:1.3rem;color:var(--fg);cursor:pointer;padding:6px}
.fab{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;border:none;background:var(--acc);color:#fff;font-size:2rem;box-shadow:0 4px 14px #0004;cursor:pointer}
dialog{border:none;border-radius:16px;max-width:600px;width:calc(100% - 24px);max-height:calc(100% - 24px);background:var(--card);color:var(--fg);padding:18px}
dialog::backdrop{background:#0008}
dialog h2{margin:0 0 10px;font-size:1.2rem}
dialog h3{font-size:1rem;margin:16px 0 6px}
form{display:grid;gap:10px}
label{font-size:.8rem;color:var(--mut);display:grid;gap:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks label{display:flex;align-items:center;gap:5px;font-size:.85rem;color:var(--fg);border:1px solid var(--bd);border-radius:999px;padding:5px 10px}
.checks input{width:auto;margin:0}
.pv{display:flex;gap:10px;align-items:center;min-height:20px;font-size:.85rem;color:var(--mut)}
.pv img{width:64px;height:64px;object-fit:cover;border-radius:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-top:10px}
.row .sp{flex:1}
.rate{display:flex;gap:2px}
.rate button{background:none;border:none;font-size:1.7rem;color:var(--bd);cursor:pointer;padding:0 2px}
.rate button.on{color:var(--star)}
.video{width:100%;border:0;border-radius:12px;background:#000;display:block}
.video.v{aspect-ratio:9/16;max-height:70vh;max-width:380px;margin:0 auto}
.video.h{aspect-ratio:16/9}
.hero{width:100%;max-height:280px;object-fit:cover;border-radius:12px}
.dv ul,.dv ol{padding-left:20px;line-height:1.5;margin:0}
.cap{white-space:pre-line;font-size:.9rem;color:var(--mut);line-height:1.45}
.res{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--bd)}
.res .b{flex:1;min-width:0}.res a{color:var(--acc)}
.shot{width:100%;max-height:220px;object-fit:cover;border-radius:12px}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:.9rem;opacity:0;transition:opacity .3s;pointer-events:none;z-index:9}
.toast.on{opacity:1}
</style>
</head>
<body>
<header>
  <div class="top"><h1>🍝 Le mie ricette</h1><button class="icon" id="camBtn" aria-label="Trova ricette da una foto">📷</button><input type="file" id="camIn" accept="image/*" capture="environment" hidden><button class="icon" id="setBtn" aria-label="Impostazioni">⚙︎</button></div>
  <input id="q" type="search" placeholder="Cerca titolo, ingrediente, etichetta…">
  <div class="chips" id="chips"></div>
  <div class="filters">
    <select id="fDiet"></select>
    <select id="fZone"></select>
    <select id="fRate"><option value="0">Ogni voto</option><option value="3">★ 3+</option><option value="4">★ 4+</option><option value="5">★ 5</option></select>
    <select id="fSort"><option value="new">Più recenti</option><option value="rate">Più votate</option><option value="az">A–Z</option></select>
  </div>
</header>
<main><div class="list" id="list"></div></main>
<button class="fab" id="add" aria-label="Aggiungi link">+</button>

<dialog id="det"><div class="dv" id="dv"></div></dialog>

<dialog id="dlg">
  <h2 id="dlgT">Nuova ricetta</h2>
  <form id="f">
    <label>Link<input name="url" type="url" required placeholder="https://…"></label>
    <div class="pv" id="pv"></div>
    <label>Titolo<input name="title" placeholder="Es. Carbonara cremosa"></label>
    <div class="two">
      <label>Tipo di piatto<select name="cat" id="catSel"></select></label>
      <label>Tempo (minuti)<input name="time" type="number" min="0" inputmode="numeric"></label>
    </div>
    <label>Diete e intolleranze<div class="checks" id="dietChecks"></div></label>
    <div class="two">
      <label>Paese / cucina<input name="country" list="countries" placeholder="Italia"></label>
      <label>Regione<input name="region" list="regions" placeholder="Lazio"></label>
    </div>
    <label>Valutazione<div class="rate" id="fRateIn"></div></label>
    <label>Ingredienti (uno per riga)<textarea name="ingredients" rows="5"></textarea></label>
    <label>Procedimento (un passaggio per riga)<textarea name="steps" rows="5"></textarea></label>
    <label>Etichette (separate da virgola)<input name="tags" placeholder="veloce, festa"></label>
    <label>Note<textarea name="note" rows="2"></textarea></label>
    <div class="row">
      <button type="button" class="btn" id="del" hidden>Elimina</button>
      <button type="button" class="btn" id="reanalyze">↻ Rianalizza</button><span class="sp"></span>
      <button type="button" class="btn" id="cancel">Annulla</button>
      <button class="btn pri">Salva</button>
    </div>
  </form>
</dialog>
<datalist id="countries"></datalist><datalist id="regions"></datalist>

<dialog id="photo"><div id="phv"></div></dialog>

<dialog id="set">
  <h2>Impostazioni</h2>

  <form id="catF"><label>Nuovo tipo di piatto<input name="c" placeholder="Es. Lievitati"></label><div class="row"><button class="btn">Aggiungi</button></div></form>
  <p class="meta">Backup: copia i dati e incollali su un altro dispositivo per trasferire le ricette.</p>
  <div class="row"><button class="btn" id="exp">Copia backup</button><button class="btn" id="imp">Incolla backup</button><button class="btn pri" id="setClose">Chiudi</button></div>
</dialog>
<div class="toast" id="toast"></div>

<script>
const $=s=>document.querySelector(s);
const load=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}};
const save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2200)};
const lines=s=>String(s||'').split('\n').map(x=>x.trim()).filter(Boolean);

const DEFAULT_CATS=['Antipasti','Primi','Secondi','Contorni','Piatti unici','Dolci','Altro'];
const DIETS=['Vegano','Vegetariano','Senza glutine','Senza lattosio','Senza uova','Senza frutta secca','Ipocalorico'];
const REGIONS=['Abruzzo','Basilicata','Calabria','Campania','Emilia-Romagna','Friuli-Venezia Giulia','Lazio','Liguria','Lombardia','Marche','Molise','Piemonte','Puglia','Sardegna','Sicilia','Toscana','Trentino-Alto Adige','Umbria',"Valle d'Aosta",'Veneto'];
const COUNTRIES=['Italia','Francia','Spagna','Grecia','Giappone','Cina','Corea','Thailandia','India','Messico','USA','Medio Oriente','Nord Africa','Sud America'];
let cats=load('cats',DEFAULT_CATS), items=load('items',[]), cur='Tutte', editing=null, formRating=0;

/* ---------- Classificazione automatica (regole sul testo e sugli ingredienti) ---------- */
const GUESS={
  'Dolci':/\btort[ae] (?!salat)|^dolc[ei]\b|tiramis|biscott|cioccolat|crostata|cheesecake|gelato|muffin|dessert|panna cotta|ciambell|plumcake|brownie|pancake|cannol|semifreddo|budino|\bcake\b/,
  'Primi':/pasta|spaghett|risott|lasagn|gnocch|carbonara|tagliatell|penne|ravioli|tortellin|zupp|minestr|vellutat|amatriciana|linguine|fusilli|orecchiette|rigatoni|paccheri|bucatini|tagliolini|cannelloni|pici|trofie|ramen|noodle/,
  'Piatti unici':/pizza|focaccia|piatto unico|burger|panin|piadin|toast|quiche|torta salata|poke|bowl|calzon|tacos|burrito/,
  'Secondi':/pollo|carne|manzo|maiale|\bpesce\b|salmone|tonno|polpett|arrosto|filetto|bistecca|scaloppin|cotolett|spezzatino|gamber|merluzzo|tacchino|frittata|vitello|orata|branzino|spigola|salsiccia|hamburger/,
  'Contorni':/contorn|insalat|patat|verdur|zucchin|melanzan|spinaci|funghi|peperon|carciof|broccol|caponata|cavolfior/,
  'Antipasti':/antipast|bruschett|finger|tartin|aperitiv|crostin|stuzzichin/
};
const CAT_SCHEMA=[[/primo|pasta|first course/,'Primi'],[/secondo|main course|main dish|entr/,'Secondi'],[/contorno|side/,'Contorni'],[/antipast|appetizer|starter/,'Antipasti'],[/dolc|dessert/,'Dolci'],[/piatto unico|lievitat|pizza/,'Piatti unici']];
const ZONES=[
  [/pad thai|tom yum|curry verde|green curry/,'Thailandia',''],
  [/carbonara|amatriciana|cacio e pepe|gricia|saltimbocca|alla romana|suppl[iì]|abbacchio|maritozz/,'Italia','Lazio'],
  [/pesto|focaccia genovese|trofie|farinata|cappon magro/,'Italia','Liguria'],
  [/alla milanese|ossobuco|pizzoccheri|cassoeula|panettone/,'Italia','Lombardia'],
  [/bologn|tortellin|tagliatelle al rag|piadin|crescentin|tigelle|passatelli|gnocco fritto|zampone/,'Italia','Emilia-Romagna'],
  [/napoletan|alla genovese|parmigiana di melanzane|sfogliatell|bab[aà]\b|friariell|pastiera|frittatin|pizza fritta|zeppol/,'Italia','Campania'],
  [/arancin|cannol|caponata|alla norma|beccafico|cassata|panelle|sfincion/,'Italia','Sicilia'],
  [/orecchiette|focaccia barese|panzerott|tiella|bombette|alla barese/,'Italia','Puglia'],
  [/ribollita|pappa al pomodoro|panzanella|fiorentina|\bpici\b|cantucci|cacciucco|castagnaccio/,'Italia','Toscana'],
  [/bagna c[aà]uda|vitello tonnato|agnolotti|bicerin|tajarin|bonet/,'Italia','Piemonte'],
  [/tiramis|bigoli|in saor|baccal[aà] mantecato|risi e bisi|alla veneziana|pandoro/,'Italia','Veneto'],
  [/culurgion|malloreddus|seadas|sebadas|porceddu|fregola/,'Italia','Sardegna'],
  [/arrosticin|alla chitarra/,'Italia','Abruzzo'],
  [/n?duja|fileja/,'Italia','Calabria'],
  [/canederl|strudel|speck/,'Italia','Trentino-Alto Adige'],
  [/frico|cjarsons/,'Italia','Friuli-Venezia Giulia'],
  [/olive all'ascolana|vincisgrassi/,'Italia','Marche'],
  [/sushi|ramen|teriyaki|tempura|onigiri|\bmiso\b|gyoza|udon|katsu|okonomiyaki|mochi/,'Giappone',''],
  [/tacos|burrito|guacamole|enchilad|quesadill|nachos|fajitas/,'Messico',''],
  [/curry|tikka|masala|\bnaan\b|\bdal\b|biryani|samosa|tandoori/,'India',''],
  [/paella|tortilla de patatas|gazpacho|churros|tapas|patatas bravas/,'Spagna',''],
  [/hummus|falafel|shawarma|tahin|baba ganoush|shakshuka/,'Medio Oriente',''],
  [/kimchi|bibimbap|bulgogi|tteok/,'Corea',''],
  [/cous ?cous|tajine|harissa/,'Nord Africa',''],
  [/gyros|moussaka|tzatziki|souvlaki|spanakopita/,'Grecia',''],
  [/dumpling|wonton|chow mein|involtini primavera|anatra laccata|dim sum|bao\b/,'Cina',''],
  [/quiche|cr[eê]pe|croissant|ratatouille|souffl|tarte tatin|croque/,'Francia',''],
  [/empanad|ceviche|arepa|chimichurri/,'Sud America',''],
  [/hamburger|pancake|brownie|cheesecake|mac and cheese|bbq|barbecue|cookies|hot dog/,'USA','']
];
const CUISINE_MAP={italian:'Italia',italiana:'Italia',italia:'Italia',french:'Francia',francese:'Francia',spanish:'Spagna',spagnola:'Spagna',greek:'Grecia',greca:'Grecia',japanese:'Giappone',giapponese:'Giappone',chinese:'Cina',cinese:'Cina',korean:'Corea',thai:'Thailandia',indian:'India',indiana:'India',mexican:'Messico',messicana:'Messico',american:'USA',americana:'USA'};
// Ingredienti che escludono una dieta
const ING={
  meat:/\bpoll|manzo|maial|vitell|agnell|tacchin|\bcarne|guancial|pancett|prosciutt|salam|salsicc|speck|bresaola|mortadell|w[uü]rstel|\brag[uù]|cotechin|lardo|\bnduja|chicken|beef|pork|bacon|\bham\b|coniglio|anatra|brodo di (carne|pollo)/,
  fish:/\bpesce|tonno|salmon|acciug|alici|gamber|cozze|vongol|calamar|polpo|seppi|merluzz|baccal|branzin|orata|spigola|frutti di mare|scampi|sgombr|sardin|bottarga|fish|shrimp|tuna|salmon|colatura/,
  dairy:/latte(?! di (soia|mandorl|avena|riso|cocco)| vegetale)|burro(?! di (arachid|cacao|mandorl))|panna(?! vegetale)|formagg|parmigian|grana|pecorin|mozzarell|ricotta|mascarpone|stracchin|gorgonzol|yogurt(?! (di soia|vegetale))|besciamell|scamorz|provol|fontina|burrata|stracciatell|cheese|butter|\bmilk|\bcream\b|feta|emmental|asiago/,
  egg:/\buov[oa]|tuorl|album|\begg|maionese/,
  honey:/\bmiele|honey/,
  gluten:/farina(?! di (riso|mais|ceci|mandorl|cocco|grano saraceno|castagne|lenticchie|tapioca)| senza glutine)|\bpasta\b(?! senza glutine)|spaghett|penne|fusilli|rigatoni|tagliatell|lasagn|gnocch|tortellin|ravioli|\bpane\b|pangrattat|cous ?cous|\borzo\b|farro|seitan|\bbirra|biscott|pizza|focaccia|cracker|bulgur|semola|grissin|piadin|pan di spagna|frolla|sfoglia|flour|bread|noodle|udon|ramen|salsa di soia/,
  nuts:/\bnoc[ei]\b|nocciol|mandorl|pistacch|anacard|arachid|pinoli|frutta secca|noci pecan|macadamia|almond|walnut|hazelnut/
};
const EXPLICIT={'Vegano':/\bvegan|\bvegana|\bvegano|plant.?based/,'Vegetariano':/vegetarian/,'Senza glutine':/senza glutine|gluten.?free|glutenfree|celiac/,'Senza lattosio':/senza lattosio|lactose.?free|senza latticini|dairy.?free/,'Senza uova':/senza uova|egg.?free/,'Ipocalorico':/ipocalor|light\b|poche calorie|low.?cal|\bfit\b|dietetic|proteic/};

function classify(d){
  const all=[d.title,d.caption,d.ingredients?.join('\n'),d.keywords,d.recipeCategory].join('\n').toLowerCase();
  const ingText=(d.ingredients||[]).join('\n').toLowerCase();
  // Tipo di piatto: prima i dati strutturati del sito, poi le parole chiave del titolo, poi del testo
  let cat=null;
  const rc=String(d.recipeCategory||'').toLowerCase();
  for(const [re,c] of CAT_SCHEMA)if(re.test(rc)&&cats.includes(c)){cat=c;break}
  for(const src of [d.title,[d.recipeCategory,d.keywords].join(' '),d.caption].map(s=>String(s||'').toLowerCase())){if(cat)break;for(const c in GUESS)if(cats.includes(c)&&GUESS[c].test(src)){cat=c;break}}
  // Diete: dalle parole esplicite sempre; per esclusione solo se c'è una lista ingredienti credibile
  const diets=new Set(d.schemaDiets||[]);
  for(const k in EXPLICIT)if(EXPLICIT[k].test(all))diets.add(k);
  if((d.ingredients||[]).length>=3){
    const has=k=>ING[k].test(ingText);
    const veg=!has('meat')&&!has('fish');
    if(veg)diets.add('Vegetariano');
    if(veg&&!has('dairy')&&!has('egg')&&!has('honey'))diets.add('Vegano');
    if(!has('gluten'))diets.add('Senza glutine');
    if(!has('dairy'))diets.add('Senza lattosio');
    if(!has('egg'))diets.add('Senza uova');
    if(!has('nuts'))diets.add('Senza frutta secca');
  }
  if(diets.has('Vegano')){diets.add('Vegetariano');diets.add('Senza lattosio');diets.add('Senza uova')}
  if(d.calories&&d.calories<=450)diets.add('Ipocalorico');
  // Zona geografica
  let country='',region='';
  for(const [re,c,r] of ZONES)if(re.test(all)){country=c;region=r;break}
  if(!country&&d.cuisine){const cu=String(d.cuisine).toLowerCase();country=CUISINE_MAP[cu]||Object.entries(CUISINE_MAP).find(([k])=>cu.includes(k))?.[1]||d.cuisine}
  if(!region)region=REGIONS.find(r=>all.includes(r.toLowerCase()))||'';
  if(region&&!country)country='Italia';
  return {cat,diets:DIETS.filter(x=>diets.has(x)),country,region};
}

/* ---------- Estrazione dati dal link ---------- */
function sourceOf(url){
  try{const h=new URL(url).hostname.replace(/^www\.|^m\./,'');
    if(/tiktok/.test(h))return 'TikTok';if(/instagram/.test(h))return 'Instagram';
    if(/youtu/.test(h))return 'YouTube';if(/facebook|fb\.watch/.test(h))return 'Facebook';
    if(/pinterest|pin\.it/.test(h))return 'Pinterest';return h}catch{return ''}
}
const extractUrl=t=>(String(t||'').match(/https?:\/\/[^\s]+/)||[])[0];
const isoMin=s=>{const m=String(s||'').match(/P(?:\d+D)?T?(?:(\d+)H)?(?:(\d+)M)?/);return m?(+m[1]||0)*60+(+m[2]||0)||null:null};
const strip=s=>String(s||'').replace(/<[^>]+>/g,' ').replace(/&nbsp;/g,' ').replace(/\s+/g,' ').trim();

// Trova un oggetto schema.org Recipe nei blocchi JSON-LD della pagina
function findRecipe(o){
  if(!o||typeof o!=='object')return null;
  if(Array.isArray(o)){for(const x of o){const r=findRecipe(x);if(r)return r}return null}
  const t=[].concat(o['@type']||[]);
  if(t.some(x=>/recipe/i.test(x)))return o;
  return findRecipe(o['@graph'])||findRecipe(o.mainEntity);
}
function stepsOf(ins){
  if(!ins)return [];
  if(typeof ins==='string')return lines(strip(ins.replace(/<\/(p|li)>|<br\s*\/?>/gi,'\n')).replace(/ (?=\d+\. )/g,'\n'));
  return [].concat(ins).flatMap(s=>typeof s==='string'?[strip(s)]:s.itemListElement?stepsOf(s.itemListElement):[strip(s.text||s.name)]).filter(Boolean);
}
function parseHtml(html){
  const d=new DOMParser().parseFromString(html,'text/html');
  const m=p=>d.querySelector(`meta[property="${p}"],meta[name="${p}"]`)?.content||'';
  const out={title:m('og:title')||m('twitter:title')||d.title||'',image:m('og:image')||m('twitter:image')||'',author:m('og:site_name'),caption:m('og:description')||m('description')};
  let r=null;
  d.querySelectorAll('script[type="application/ld+json"]').forEach(s=>{if(!r)try{r=findRecipe(JSON.parse(s.textContent))}catch{}});
  if(r){
    const img=[].concat(r.image||[])[0];
    Object.assign(out,{title:strip(r.name)||out.title,image:(typeof img==='string'?img:img?.url)||out.image,
      ingredients:[].concat(r.recipeIngredient||r.ingredients||[]).map(strip).filter(Boolean),steps:stepsOf(r.recipeInstructions),
      cuisine:[].concat(r.recipeCuisine||[]).join(', '),recipeCategory:[].concat(r.recipeCategory||[]).join(', '),keywords:[].concat(r.keywords||[]).join(', '),
      time:isoMin(r.totalTime)||((isoMin(r.prepTime)||0)+(isoMin(r.cookTime)||0))||null,
      calories:Math.round(parseFloat(String(r.nutrition?.calories||'').replace(',','.')))||null,
      schemaDiets:[].concat(r.suitableForDiet||[]).map(x=>({VeganDiet:'Vegano',VegetarianDiet:'Vegetariano',GlutenFreeDiet:'Senza glutine',LowLactoseDiet:'Senza lattosio',LowCalorieDiet:'Ipocalorico'})[String(x).split('/').pop()]).filter(Boolean),
      videoEmbed:[].concat(r.video||[])[0]?.embedUrl||''});
  }
  return out;
}
// Ricava ingredienti e passaggi dal testo di un post (didascalia TikTok/Instagram)
function parseCaption(text){
  const ls=lines(text),res={ingredients:[],steps:[]};
  const iI=ls.findIndex(l=>/ingredient/i.test(l)), iS=ls.findIndex(l=>/procediment|preparazione|istruzion|come si fa|method|steps|direction/i.test(l));
  if(iI>=0)res.ingredients=ls.slice(iI+1,iS>iI?iS:undefined);
  else res.ingredients=ls.filter(l=>/^[-•▪️✅🔸🔹*]|\d+\s?(g|gr|ml|kg|cl|l)\b|cucchia|q\.?b|pizzico|spicchi/i.test(l)&&l.length<80);
  if(iS>=0)res.steps=ls.slice(iS+1).filter(l=>!/^#/.test(l));
  res.ingredients=res.ingredients.map(l=>l.replace(/^[-•▪️✅🔸🔹*\s]+/u,'')).filter(l=>l&&!/^#/.test(l)).slice(0,40);
  const t=String(text).match(/(\d+)\s?(min|minuti)\b/i);if(t)res.time=+t[1];
  return res;
}
async function getJson(u,ctl){return (await fetch(u,{signal:ctl.signal})).json()}
async function analyze(url){
  const ctl=new AbortController();setTimeout(()=>ctl.abort(),10000);
  const src=sourceOf(url);let out={};
  try{
    if(src==='TikTok'){
      const j=await getJson('https://www.tiktok.com/oembed?url='+encodeURIComponent(url),ctl);
      out={title:j.title||'',caption:j.title||'',image:j.thumbnail_url||'',author:j.author_name||'',videoId:j.embed_product_id||''};
    }else if(src==='YouTube'){
      const j=await getJson('https://www.youtube.com/oembed?format=json&url='+encodeURIComponent(url),ctl);
      out={title:j.title||'',image:j.thumbnail_url||'',author:j.author_name||''};
    }
    if(src!=='YouTube'&&src!=='TikTok'){
      const res=await fetch(url,{signal:ctl.signal});out=parseHtml(await res.text());
      if(res.url&&res.url!==url)out.finalUrl=res.url;
    }
  }catch{if(!Object.keys(out).length)return null}
  if(!out.ingredients?.length&&out.caption){
    const pc=parseCaption(out.caption);
    out.ingredients=pc.ingredients;if(!out.steps?.length)out.steps=pc.steps;out.time=out.time||pc.time;
  }
  // Nei post social il titolo è la didascalia: tieni solo la prima riga, senza hashtag
  if(out.title)out.title=(lines(out.title)[0]||'').replace(/\s*#\S+/g,'').trim().slice(0,140);
  return out;
}

/* ---------- AI (tramite il server dell'app, nessuna chiave per l'utente) ---------- */
// Indirizzo del server Cloudflare (cartella server/); vuoto = funzioni AI disattivate
const AI_URL=(()=>{try{return localStorage.getItem('aiUrl')}catch{}})()||'';
const aiOn=()=>!!AI_URL;
async function server(path,body){
  const ctl=new AbortController();setTimeout(()=>ctl.abort(),90000);
  let res;
  try{res=await fetch(AI_URL+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),signal:ctl.signal})}
  catch{throw Object.assign(new Error('Servizio AI non raggiungibile: controlla la connessione'),{status:0})}
  const d=await res.json().catch(()=>({}));
  if(!res.ok)throw Object.assign(new Error(d.error||res.statusText),{status:res.status});
  return d;
}
const aiErr=e=>e?.status===429?'Troppe richieste, riprova tra un minuto':e?.message||'Servizio AI non disponibile';

// Estrae i dati di una ricetta da un post social (didascalia + copertina, analizzati dal server)
async function aiAnalyze(d){
  const {result:r}=await server('/analyze',{url:d.url,source:sourceOf(d.url),author:d.author,caption:d.caption||d.title,image:d.image,cats});
  if(!r)throw new Error('Risposta AI non valida');
  return {is_recipe:r.is_recipe!==false,title:r.title||'',cat:r.cat||'',diets:(r.diets||[]).filter(x=>DIETS.includes(x)),country:r.country||'',region:r.region||'',
    time:+r.time||0,ingredients:(r.ingredients||[]).map(String),steps:(r.steps||[]).map(String)};
}

// Riduce la foto per contenere costi e tempi di invio
function shrink(file){return new Promise((ok,ko)=>{
  const img=new Image();img.onload=()=>{const s=Math.min(1,1280/Math.max(img.width,img.height)),c=document.createElement('canvas');
    c.width=img.width*s;c.height=img.height*s;c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(img.src);
    ok(c.toDataURL('image/jpeg',.85))};img.onerror=ko;img.src=URL.createObjectURL(file)})}

  const dataUrl=await shrink(file);

  // Tiene i link il cui sito compare davvero tra le fonti della ricerca Google; aggiunge le altre fonti trovate
  const host=u=>{try{return new URL(u).hostname.replace(/^www\./,'')}catch{return ''}};

  ph.innerHTML=`<img class="shot" src="${img}" alt="">

    ${r.alternatives?.length?`<p class="meta">Potrebbe anche essere: ${r.alternatives.map(esc).join(', ')}</p>`:''}
    ${mine.length?`<h3>Già nelle tue ricette</h3>${mine.map(i=>`<div class="res"><div class="b"><b>${esc(i.title)}</b><div class="meta">${esc([i.cat,i.source].join(' · '))} ${stars(i.rating)}</div></div><button class="btn" data-open="${i.id}">Apri</button></div>`).join('')}`:''}
    <h3>Ricette trovate sul web</h3>

    <div class="row"><button class="btn" id="phClose">Chiudi</button></div>`;

/* ---------- Video ---------- */
function embedOf(i){
  const u=i.finalUrl||i.url;let m;
  if(m=u.match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|embed\/|live\/)|youtu\.be\/)([\w-]{11})/))return {src:'https://www.youtube-nocookie.com/embed/'+m[1],v:/shorts/.test(u)};
  if(i.source==='TikTok'){const id=i.videoId||(u.match(/video\/(\d+)/)||[])[1];if(id)return {src:'https://www.tiktok.com/embed/v2/'+id,v:true}}
  if(m=u.match(/instagram\.com\/(?:[\w.]+\/)?(p|reels?|tv)\/([\w-]+)/))return {src:`https://www.instagram.com/${m[1]==='reels'?'reel':m[1]}/${m[2]}/embed`,v:true};
  if(i.source==='Facebook')return {src:'https://www.facebook.com/plugins/video.php?href='+encodeURIComponent(u),v:false};
  if(i.videoEmbed)return {src:i.videoEmbed,v:false};
  return null;
}

async function runAnalysis(url,overwrite){
  const f=$('#f');showPv('Analizzo la ricetta…');
  const a=await analyze(url);
  if(f.url.value!==url)return;
  if(!a){showPv('Non riesco a leggere la pagina: compila tu i dati');return}
  Object.assign(extra,{image:a.image||extra.image,author:a.author||extra.author,caption:a.caption||extra.caption,videoId:a.videoId||extra.videoId,videoEmbed:a.videoEmbed||extra.videoEmbed,finalUrl:a.finalUrl||extra.finalUrl});
  const put=(el,v)=>{if(v&&(overwrite||!el.value))el.value=v};
  put(f.title,a.title);put(f.time,a.time);
  put(f.ingredients,(a.ingredients||[]).join('\n'));put(f.steps,(a.steps||[]).join('\n'));
  const c=classify({...a,title:f.title.value,ingredients:lines(f.ingredients.value)});
  if(c.cat&&(overwrite||!editing))f.cat.value=c.cat;
  put(f.country,c.country);put(f.region,c.region);
  setDiets([...new Set([...(overwrite?[]:getDiets()),...c.diets])]);
  const n=(a.ingredients||[]).length;
  showPv(n?`Trovati ${n} ingredienti`:'Ingredienti non trovati: aggiungili tu se vuoi');
  // Post social o pagine senza dati strutturati: completa con l'AI se la chiave è configurata
  if(aiOn()&&(['TikTok','Instagram','YouTube','Facebook','Pinterest'].includes(sourceOf(url))||n<3)){
    showPv('Analisi AI della ricetta…');
    try{
      const r=await aiAnalyze({url,title:f.title.value,caption:a.caption,image:a.image,author:a.author});
      if(f.url.value!==url)return;
      if(!r.is_recipe){showPv('L\'AI non trova una ricetta in questo post');return}
      if(r.title&&(overwrite||!f.title.value||f.title.value.length>80))f.title.value=r.title;
      if(cats.includes(r.cat))f.cat.value=r.cat;
      if(r.ingredients.length>=n)f.ingredients.value=r.ingredients.join('\n');
      if(r.steps.length&&!(a.steps||[]).length)f.steps.value=r.steps.join('\n');
      if(r.time&&(overwrite||!f.time.value))f.time.value=r.time;
      if(r.country){f.country.value=r.country;f.region.value=r.region}
      setDiets(r.diets);
      showPv(`Analisi AI completata · ${r.ingredients.length} ingredienti`);
    }catch(e){showPv(aiErr(e))}
  }
}

$('#exp').onclick=async()=>{try{await navigator.clipboard.writeText(JSON.stringify({cats,items}));toast('Backup copiato negli appunti')}catch{prompt('Copia questo testo:',JSON.stringify({cats,items}))}};
$('#imp').onclick=async()=>{
  let t;try{t=await navigator.clipboard.readText()}catch{}
  if(!t)t=prompt('Incolla qui il backup:');if(!t)return;
  try{const d=JSON.parse(t),ids=new Set(items.map(i=>i.id));
    cats=[...new Set([...cats,...(d.cats||[])])];items=[...items,...(d.items||[]).filter(i=>!ids.has(i.id))];
    save('cats',cats);save('items',items);fillSelects();render();toast('Backup importato')}catch{toast('Backup non valido')}
};

// Link in arrivo: da Android (condividi verso l'APK) o da URL ?url=/&text= (share target web, Comandi Rapidi iOS)
function receive(d){
  const url=extractUrl(d.url)||extractUrl(d.text)||extractUrl(d.title);
  if(!url)return;
  const ex=items.find(i=>i.url===url);
  if(ex){toast('Ricetta già salvata');openDetail(ex);return}
  const title=(d.title&&!extractUrl(d.title))?d.title:'';
  openForm({url,title});
}
window.onShared=()=>{const s=window.AndroidShare?.take();if(s)receive(JSON.parse(s))};
const p=new URLSearchParams(location.search);
if(p.has('url')||p.has('text')){receive({url:p.get('url'),text:p.get('text'),title:p.get('title')});history.replaceState(null,'',location.pathname)}
window.onShared();

fillSelects();render();
if('serviceWorker' in navigator&&location.protocol==='https:'&&location.hostname!=='localhost')navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
